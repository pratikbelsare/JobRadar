[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-intelligence"
version = "0.1.0"
description = "Core models and configuration for a personal job intelligence platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34,<2",
    "fastapi>=0.115,<1",
    "pydantic>=2.6,<3",
    "pypdf>=4.0,<6",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]
local-ai = [
    "sentence-transformers>=3.0,<6",
]
ui = [
    "streamlit>=1.39,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
mypy_path = "src"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
